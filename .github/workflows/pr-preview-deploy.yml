name: PR Preview Deploy

on:
  workflow_run:
    workflows: ["PR Preview Build"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pages-dist
          path: ./out
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR metadata from artifact
        id: meta
        run: |
          PR_NUMBER=$(cat ./out/_pr-meta/pr_number)
          HEAD_SHA=$(cat ./out/_pr-meta/head_sha)
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "PR number: $PR_NUMBER, HEAD SHA: $HEAD_SHA"

      - name: Clean up metadata before deploy
        run: rm -rf ./out/_pr-meta

      # Block Pages Functions for fork PR security
      - name: Block Pages Functions for external preview
        run: |
          test ! -d ./out/functions
          test ! -f ./out/_worker.js

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
          CF_PROJECT_NAME: zvec-web
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          OUTPUT=$(npx wrangler pages deploy ./out \
            --project-name "$CF_PROJECT_NAME" \
            --branch "pr-${PR_NUMBER}" \
            --commit-hash "$HEAD_SHA" \
            --commit-message "Preview for PR #${PR_NUMBER}")
          
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -Eo 'https://[^ ]+\.pages\.dev' | head -n 1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        env:
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "::warning::Could not determine PR number, skipping comment."
            exit 0
          fi
          gh pr comment "$PR_NUMBER" \
            --repo "$GH_REPO" \
            --edit-last \
            --create-if-none \
            --body "☁️ Cloudflare Pages preview: $PREVIEW_URL"
